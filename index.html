<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protokollgenerator - BRF Gullvivan</title>
  
  <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 30px 15px;
      line-height: 1.5;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .brand-header {
      border-bottom: 3px solid var(--primary);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .brand-header h1 {
      color: var(--primary);
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    .brand-header p {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 2px;
    }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 5px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 70px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 25px;
      margin-bottom: 12px;
      padding-bottom: 4px;
      border-bottom: 2px solid #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .para-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      position: relative;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; padding: 14px; font-size: 1.05rem; margin-top: 25px; }
    .btn-primary:hover { background: #172554; }
    .btn-danger { background: #ef4444; color: #fff; font-size: 0.8rem; padding: 4px 8px; position: absolute; top: 12px; right: 12px; }
  </style>
</head>
<body>

<div class="container">
  <div class="brand-header">
    <h1>Bostadsrättsföreningen Gullvivan</h1>
    <p>Katrineholm Gullvivan 5 | Malmgatan 2, 4 och 6 | Org.nr: 718500-0523</p>
  </div>

  <div class="section-title">1. Mötesinformation & Tider</div>
  <div class="row">
    <div class="form-group">
      <label>Mötestyp / Rubrik</label>
      <input type="text" id="meetingType" value="STYRELSEMÖTE">
    </div>
    <div class="form-group">
      <label>Mötesdatum</label>
      <input type="date" id="meetingDate" value="2026-09-17">
    </div>
  </div>
  <div class="row">
    <div class="form-group">
      <label>Startnummer för paragrafer (År–Nr)</label>
      <input type="text" id="startNr" value="2026–82" placeholder="T.ex. 2026–82">
    </div>
    <div class="form-group">
      <label>Tid & Plats</label>
      <input type="text" id="meetingPlace" value="Föreningslokalen, kl 18:30">
    </div>
  </div>

  <div class="section-title">2. Närvarande & Justering</div>
  <div class="form-group">
    <label>Beslutande närvarande (skriv ett namn per rad)</label>
    <textarea id="attendees" rows="4">Göran Andersson
Robert Zweiniger
Mikko Virkkunen
Robert Lindkvist
Monica Wiren</textarea>
  </div>
  <div class="row">
    <div class="form-group">
      <label>Protokollförare (Vid protokollet)</label>
      <input type="text" id="secretary" value="Mikko Virkkunen">
    </div>
    <div class="form-group">
      <label>Justerare</label>
      <input type="text" id="adjuster" value="Göran Andersson">
    </div>
  </div>

  <div class="section-title">3. Paragrafer & Ärenden</div>
  <div id="paragraphsContainer"></div>

  <button type="button" class="btn btn-secondary" onclick="addParagraph()">+ Lägg till paragraf</button>

  <div class="section-title">Generera</div>
  <button type="button" id="downloadBtn" class="btn btn-primary" onclick="generateDocx()">Ladda ner formaterat protokoll (.docx)</button>
</div>

<script>
  let paraItems = [
    { title: "Mötets öppnande", text: "Göran Andersson öppnar mötet och hälsade alla välkomna. Robert Lindkvist inträdde som tjänstgörande suppleant för ordinarie ledamot Urban Ehrlin." },
    { title: "Dagordning", text: "Den föreslagna dagordningen godkändes." },
    { title: "Protokolljustering", text: "Protokollet från styrelsemötet 2026-08-20 lästes upp och godkändes." },
    { title: "Rapporter", text: "a) Kärlskåp:\nKärlskåpen har monterats och levererats enligt plan. Slutkostnaden uppgår till 573 580 kr enligt antagen offert. Faktura från Certego avseende montering och anpassning av lås har inkommit och godkänts med 10 877 kr inkl. moms.\n\nb) Garagekontrakt:\nNya standardiserade kontrakt har tagits fram för garage och bilplatser utomhus. Garageavtal samt kvittens för nyckel, tagg och garageöppnare slås i fortsättningen samman till ett gemensamt avtal för enklare hantering och tydligare ansvarsfördelning." },
    { title: "Ekonomi", text: "a) Offert Vesam:\nFrågan bordläggs i väntan på en kompletterande offert från MSAB.\n\nb) Nya Villkor för lån:\nFöreningens lån med nummer 33663579 och 47896177 har villkorsändrats med en fastställd ränta om 2,89 %.\n\nc) Offert från Presto:\nOffert har inkommit från Presto gällande besiktning av föreningens fyra skyddsrum till en kostnad av 3 000 kr per skyddsrum (totalt 12 000 kr). Styrelsen beslutar att tacka nej till offerten, då fastighetsägaren själv ansvarar för underhållet och lagkrav på extern årlig besiktning saknas. Styrelsen genomför erforderlig översyn och åtgärder i egen regi." },
    { title: "Störningsjour", text: "Frågan om att anlita en extern störningsjour har lyfts till styrelsen. Efter diskussion beslutar styrelsen att inte teckna avtal om störningsjour i dagsläget. Eventuella störningar hanteras som tidigare genom föreningens ordinarie rutiner och dialog med styrelsen." },
    { title: "Sopkasuner", text: "Styrelsen beslutar att informera medlemmarna om att hushållssopor/restavfall från och med den 1 oktober 2026 ska slängas i markbehållarna på gård 2 och 6, samt att matavfall ska lämnas i markbehållaren på gård 4. Ett informationsblad tas fram och delas ut i varje lägenhets brevlåda." },
    { title: "Andrahandsuthyrning", text: "• Lägenhet B410 (Malmgatan 4D): Youssef Kourieh ansöker om förlängning av uthyrning till Laila Youssef under perioden 2026-09-22 till 2027-03-22. Styrelsen beslutar att bevilja ansökan. (se bilaga 2).\n• Lägenhet C313 (Malmgatan 6E): Emelie Widlund ansöker om uthyrning till Daniela Alexandra Zelaya Hernandez under perioden 2026-11-01 till 2027-10-31. Styrelsen beslutar att bevilja ansökan. (se bilaga)." },
    { title: "Nya frågor", text: "Inga övriga frågor anmäldes eller behandlades." },
    { title: "Nästa styrelsemöte", text: "I föreningslokalen 22/10–26 kl 18:00." },
    { title: "Avslutning", text: "Ordförande Göran Andersson tackade de närvarande för visat intresse och förklarade mötet avslutat." }
  ];

  function renderParagraphs() {
    const container = document.getElementById('paragraphsContainer');
    container.innerHTML = '';
    paraItems.forEach((p, idx) => {
      const div = document.createElement('div');
      div.className = 'para-card';
      div.id = 'para-' + idx;
      div.innerHTML = `
        <button type="button" class="btn btn-danger" onclick="removeParagraph(${idx})">Ta bort</button>
        <div class="form-group">
          <label>Punkt ${idx + 1} - Ärenderubrik</label>
          <input type="text" class="para-title" value="${p.title}">
        </div>
        <div class="form-group">
          <label>Beslut / Anteckningar</label>
          <textarea class="para-text" rows="3">${p.text}</textarea>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function addParagraph() {
    paraItems.push({ title: "Nytt ärende", text: "" });
    renderParagraphs();
  }

  function removeParagraph(idx) {
    saveCurrentInputs();
    paraItems.splice(idx, 1);
    renderParagraphs();
  }

  function saveCurrentInputs() {
    const titles = document.querySelectorAll('.para-title');
    const texts = document.querySelectorAll('.para-text');
    titles.forEach((t, i) => {
      if (paraItems[i]) {
        paraItems[i].title = t.value;
        paraItems[i].text = texts[i].value;
      }
    });
  }

  window.addEventListener('DOMContentLoaded', renderParagraphs);

  async function generateDocx() {
    saveCurrentInputs();
    const btn = document.getElementById('downloadBtn');
    btn.textContent = "Skapar Word-fil...";
    btn.disabled = true;

    try {
      const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, ShadingType, AlignmentType } = docx;

      const meetingDate = document.getElementById('meetingDate').value || "2026-09-17";
      const startNrStr = document.getElementById('startNr').value || "2026–82";
      const secretary = document.getElementById('secretary').value;
      const adjuster = document.getElementById('adjuster').value;
      const attendees = document.getElementById('attendees').value.split('\n').filter(n => n.trim().length > 0);

      // Dela upp startnr t.ex. "2026–82"
      let prefix = "2026–";
      let startNumber = 82;
      const match = startNrStr.match(/^(.*?)(\d+)$/);
      if (match) {
        prefix = match[1];
        startNumber = parseInt(match[2], 10);
      }

      // Tunna kanter i Gullvivan-grå stil
      const thinBorder = { style: BorderStyle.SINGLE, size: 4, color: "CBD5E1" };
      const noBorder = { style: BorderStyle.NONE, size: 0, color: "FFFFFF" };

      const docChildren = [];

      // 1. TOPPRUBRIK (Samma som P-platsavtalet)
      docChildren.push(
        new Paragraph({
          children: [
            new TextRun({ text: "PROTOKOLL FÖR STYRELSEMÖTE", bold: true, size: 30, color: "1E3A8A" })
          ],
          spacing: { after: 60 }
        }),
        new Paragraph({
          children: [
            new TextRun({ text: "Bostadsrättsföreningen Gullvivan", bold: true, size: 22, color: "334155" })
          ],
          spacing: { after: 40 }
        }),
        new Paragraph({
          children: [
            new TextRun({ text: "Fastighet: Katrineholm Gullvivan 5 | Malmgatan 2, 4 och 6 | Org.nr: 718500-0523", size: 18, color: "64748B" })
          ],
          spacing: { after: 200 }
        })
      );

      // 2. INTRO-BOX (Mötesinformation)
      docChildren.push(
        new Table({
          width: { size: 100, type: WidthType.PERCENTAGE },
          borders: { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder, insideHorizontal: thinBorder, insideVertical: thinBorder },
          rows: [
            new TableRow({
              children: [
                new TableCell({
                  shading: { type: ShadingType.CLEAR, fill: "F1F5F9" },
                  children: [new Paragraph({ children: [new TextRun({ text: "MÖTESDATUM & TID", bold: true, size: 18, color: "1E3A8A" })] })],
                  width: { size: 50, type: WidthType.PERCENTAGE },
                  margins: { top: 100, bottom: 100, left: 140, right: 140 }
                }),
                new TableCell({
                  shading: { type: ShadingType.CLEAR, fill: "F1F5F9" },
                  children: [new Paragraph({ children: [new TextRun({ text: "PLATS", bold: true, size: 18, color: "1E3A8A" })] })],
                  width: { size: 50, type: WidthType.PERCENTAGE },
                  margins: { top: 100, bottom: 100, left: 140, right: 140 }
                })
              ]
            }),
            new TableRow({
              children: [
                new TableCell({
                  children: [new Paragraph({ children: [new TextRun({ text: meetingDate, size: 20 })] })],
                  margins: { top: 100, bottom: 100, left: 140, right: 140 }
                }),
                new TableCell({
                  children: [new Paragraph({ children: [new TextRun({ text: document.getElementById('meetingPlace').value || "Föreningslokalen", size: 20 })] })],
                  margins: { top: 100, bottom: 100, left: 140, right: 140 }
                })
              ]
            })
          ]
        }),
        new Paragraph({ text: "", spacing: { after: 150 } })
      );

      // 3. TVÅSPALTIG ÖVERSIKT: DAGORDNING & NÄRVARANDE (Samma struktur som ert nuvarande protokoll)
      const agendaRows = paraItems.map((p, i) => `${i + 1}. ${p.title}`).join('\n');
      const attendeesRows = attendees.join('\n');

      docChildren.push(
        new Table({
          width: { size: 100, type: WidthType.PERCENTAGE },
          borders: { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder, insideHorizontal: thinBorder, insideVertical: thinBorder },
          rows: [
            new TableRow({
              children: [
                new TableCell({
                  shading: { type: ShadingType.CLEAR, fill: "F1F5F9" },
                  children: [new Paragraph({ children: [new TextRun({ text: "DAGORDNING", bold: true, size: 18, color: "1E3A8A" })] })],
                  width: { size: 50, type: WidthType.PERCENTAGE },
                  margins: { top: 80, bottom: 80, left: 120, right: 120 }
                }),
                new TableCell({
                  shading: { type: ShadingType.CLEAR, fill: "F1F5F9" },
                  children: [new Paragraph({ children: [new TextRun({ text: "BESLUTANDE NÄRVARANDE", bold: true, size: 18, color: "1E3A8A" })] })],
                  width: { size: 50, type: WidthType.PERCENTAGE },
                  margins: { top: 80, bottom: 80, left: 120, right: 120 }
                })
              ]
            }),
            new TableRow({
              children: [
                new TableCell({
                  children: paraItems.map((p, i) => new Paragraph({
                    children: [new TextRun({ text: `${i + 1}. ${p.title}`, size: 19 })],
                    spacing: { after: 40 }
                  })),
                  margins: { top: 120, bottom: 120, left: 120, right: 120 }
                }),
                new TableCell({
                  children: attendees.map(person => new Paragraph({
                    children: [new TextRun({ text: person, size: 19 })],
                    spacing: { after: 40 }
                  })),
                  margins: { top: 120, bottom: 120, left: 120, right: 120 }
                })
              ]
            })
          ]
        }),
        new Paragraph({ text: "", spacing: { after: 250 } })
      );

      // 4. PARAGRAFER & BESLUT
      paraItems.forEach((p, idx) => {
        const currentParaNr = `${prefix}${startNumber + idx}`;

        // Paragrafrubrik med stilren färgram (Gullvivan-stil)
        docChildren.push(
          new Table({
            width: { size: 100, type: WidthType.PERCENTAGE },
            borders: { top: thinBorder, bottom: thinBorder, left: noBorder, right: noBorder, insideHorizontal: noBorder, insideVertical: noBorder },
            rows: [
              new TableRow({
                children: [
                  new TableCell({
                    shading: { type: ShadingType.CLEAR, fill: "F8FAFC" },
                    children: [
                      new Paragraph({
                        children: [
                          new TextRun({ text: currentParaNr + "   ", bold: true, size: 21, color: "1E3A8A" }),
                          new TextRun({ text: p.title, bold: true, size: 21, color: "0F172A" })
                        ]
                      })
                    ],
                    margins: { top: 80, bottom: 80, left: 100, right: 100 }
                  })
                ]
              })
            ]
          }),
          new Paragraph({ text: "", spacing: { after: 40 } })
        );

        // Brödtext med radbrytningar
        const lines = p.text.split('\n');
        lines.forEach(line => {
          docChildren.push(
            new Paragraph({
              children: [new TextRun({ text: line, size: 20, color: "1E293B" })],
              spacing: { after: 80 }
            })
          );
        });

        docChildren.push(new Paragraph({ text: "", spacing: { after: 120 } }));
      });

      // 5. SIGNATURER / JUSTERING (Exakt samma layout som p-platsavtalet)
      docChildren.push(
        new Paragraph({ text: "", spacing: { before: 200, after: 100 } }),
        new Table({
          width: { size: 100, type: WidthType.PERCENTAGE },
          borders: { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder, insideHorizontal: thinBorder, insideVertical: thinBorder },
          rows: [
            new TableRow({
              children: [
                new TableCell({
                  shading: { type: ShadingType.CLEAR, fill: "F1F5F9" },
                  children: [new Paragraph({ children: [new TextRun({ text: "VID PROTOKOLLET", bold: true, size: 18, color: "1E3A8A" })] })],
                  width: { size: 50, type: WidthType.PERCENTAGE },
                  margins: { top: 80, bottom: 80, left: 120, right: 120 }
                }),
                new TableCell({
                  shading: { type: ShadingType.CLEAR, fill: "F1F5F9" },
                  children: [new Paragraph({ children: [new TextRun({ text: "JUSTERARE", bold: true, size: 18, color: "1E3A8A" })] })],
                  width: { size: 50, type: WidthType.PERCENTAGE },
                  margins: { top: 80, bottom: 80, left: 120, right: 120 }
                })
              ]
            }),
            new TableRow({
              children: [
                new TableCell({
                  children: [
                    new Paragraph({ text: "", spacing: { after: 400 } }),
                    new Paragraph({ children: [new TextRun({ text: "____________________________________", color: "94A3B8" })] }),
                    new Paragraph({ children: [new TextRun({ text: secretary || "Mikko Virkkunen", bold: true, size: 20 })] }),
                    new Paragraph({ children: [new TextRun({ text: "Sekreterare / Protokollförare", size: 17, color: "64748B" })] })
                  ],
                  margins: { top: 120, bottom: 120, left: 120, right: 120 }
                }),
                new TableCell({
                  children: [
                    new Paragraph({ text: "", spacing: { after: 400 } }),
                    new Paragraph({ children: [new TextRun({ text: "____________________________________", color: "94A3B8" })] }),
                    new Paragraph({ children: [new TextRun({ text: adjuster || "Göran Andersson", bold: true, size: 20 })] }),
                    new Paragraph({ children: [new TextRun({ text: "Mötesordförande / Justerare", size: 17, color: "64748B" })] })
                  ],
                  margins: { top: 120, bottom: 120, left: 120, right: 120 }
                })
              ]
            })
          ]
        })
      );

      const doc = new Document({
        styles: {
          default: {
            document: {
              run: {
                font: "Calibri"
              }
            }
          }
        },
        sections: [{
          properties: {
            page: {
              margin: {
                top: 1000,
                bottom: 1000,
                left: 1200,
                right: 1200
              }
            }
          },
          children: docChildren
        }]
      });

      const blob = await Packer.toBlob(doc);
      const filename = `Styrelsemöte_${meetingDate}.docx`;
      saveAs(blob, filename);

    } catch (err) {
      alert("Fel vid skapandet av Word-filen: " + err.message);
      console.error(err);
    } finally {
      btn.textContent = "Ladda ner formaterat protokoll (.docx)";
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
